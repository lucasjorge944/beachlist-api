createCustomerUser:
    name: ${self:service}-create-customer-user
    handler: src/presentation/handlers/user-handler.createCustomerUser
    environment:
        ENV: ${self:custom.ENV}
        FUNCTION_URL: ${self:custom.FUNCTION_URL}
        MONGO: ${self:custom.MONGO}
    events:
        - httpApi:
              path: /user/create-customer
              method: POST
