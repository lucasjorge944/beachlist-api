login:
    name: ${env:FUNC_PREFIX, 'sandbox'}-${self:service}-login
    handler: src/presentation/handlers/auth-handler.login
    environment:
        ENV: ${self:custom.ENV}
        FUNCTION_URL: ${self:custom.FUNCTION_URL}
        MONGO: ${self:custom.MONGO}
    events:
        - httpApi:
              path: /auth/login
              method: POST
