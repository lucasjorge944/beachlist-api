service: beachlist-api
frameworkVersion: "3"
configValidationMode: error

provider:
    name: aws
    region: us-east-1
    runtime: nodejs18.x
    memorySize: 512
    timeout: 29
    logRetentionInDays: 7
    versionFunctions: false
    tracing:
        lambda: false
        apiGateway: false
    httpApi:
        id: ${self:custom.API_GATEWAY_ID}
        metrics: false

functions:
    - ${file(src/presentation/routes/user-routes.yml)}
    - ${file(src/presentation/routes/place-routes.yml)}
    - ${file(src/presentation/routes/plan-routes.yml)}
    - ${file(src/presentation/routes/auth-routes.yml)}

custom:
    ENV: ${env:FUNC_PREFIX, 'sandbox'}
    FUNCTION_URL: ${env:FUNCTION_URL, 'https://e79lapd7qc.execute-api.us-east-1.amazonaws.com'}
    API_GATEWAY_ID: ${env:API_GATEWAY_ID, 'e79lapd7qc'}
    MONGO: ${env:MONGO_URI, 'mongodb+srv://myapi:F9r41705@beachlist-cluster.lxv3e.mongodb.net/beachlist-sandbox?retryWrites=true&w=majority&appName=beachlist'}
    serverless-offline:
        httpPort: 8085
        lambdaPort: 8086

plugins:
    - serverless-plugin-typescript
    - serverless-offline
    - serverless-dotenv-plugin
    - "@shelf/serverless-simplify-default-exec-role-plugin"

package:
    individually: false
    excludeDevDependencies: true
